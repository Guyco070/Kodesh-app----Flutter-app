<!DOCTYPE html>
<html lang="he">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="קודש – זמני כניסת ויציאת שבת, זמני חגים, זמני היום ההלכתיים, לוח חגים, דף יומי ותפילות. Shabbat and holiday times, zmanim, Jewish holiday calendar, Daf Yomi and prayers.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Social sharing previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="קודש – זמני שבת, חגים וזמני היום">
  <meta property="og:description" content="זמני כניסת ויציאת שבת, זמני חגים, זמני היום ההלכתיים, לוח חגים, דף יומי ותפילות.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="he_IL">
  <meta name="twitter:card" content="summary">

  <!-- Theme color for browser chrome / status bar -->
  <meta name="theme-color" content="#1A1A2E" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="קודש">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>

  <title>קודש – זמני שבת, חגים וזמני היום</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <noscript>
    <p dir="rtl" lang="he">כדי להשתמש באתר קודש יש להפעיל JavaScript בדפדפן.</p>
    <p lang="en">Please enable JavaScript to use Kodesh.</p>
  </noscript>
  <script>
    window.needsCompassPermission = function () {
      return typeof DeviceOrientationEvent !== 'undefined' &&
             typeof DeviceOrientationEvent.requestPermission === 'function';
    };
    window.requestCompassPermission = async function () {
      if (window.needsCompassPermission()) {
        const result = await DeviceOrientationEvent.requestPermission();
        return result === 'granted';
      }
      return true;
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
